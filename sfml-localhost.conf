<VirtualHost *:80>
    ServerName sfml.localhost
    ServerAlias www.sfml.localhost
    DocumentRoot /var/www/html
    DirectoryIndex index.html
</VirtualHost>

<VirtualHost *:443>
    ServerName sfml.localhost
    ServerAlias www.sfml.localhost
    DocumentRoot /var/www/html
    DirectoryIndex index.html

    SSLEngine on
    SSLCertificateFile /etc/apache2/certs/sfml.localhost.pem
    SSLCertificateKeyFile /etc/apache2/certs/sfml.localhost-key.pem
</VirtualHost>
